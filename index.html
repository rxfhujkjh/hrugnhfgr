<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apps</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: sans-serif; background: #121212; color: #eee; margin: 0; padding: 24px 16px; }
  .wrap { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 18px; }
  .tile { display: block; background: #1e1e1e; border: 1px solid #333; border-radius: 10px; padding: 18px 20px; margin-bottom: 12px; text-decoration: none; color: #eee; height: 96px; }
  .tile .name { font-size: 22px; font-weight: 700; }
  .tile .desc { font-size: 16px; color: #aaa; margin-top: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Apps</h1>
  <a class="tile" href="player.html">
    <div class="name">Activities</div>
    <div class="desc">Things to do and keep on top of</div>
  </a>
  <a class="tile" href="results.html">
    <div class="name">Results</div>
    <div class="desc">Latest market results</div>
  </a>
  <a class="tile" href="scorecard.html">
    <div class="name">Scorecard</div>
    <div class="desc">Results Detail</div>
  </a>
</div>
</body>
</html>
